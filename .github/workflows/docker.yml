name: Build and publish Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 0.1.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT";
          else echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: docker build --platform linux/amd64 -t ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }} .
      - name: Smoke test (container starts, serves HTTP as uid 1000)
        run: |
          docker run -d --name app -p 7860:7860 ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          for i in $(seq 1 30); do curl -fsS http://localhost:7860/ >/dev/null && break; sleep 2; done
          curl -fsS http://localhost:7860/ | grep -q "Xenium Panel Identifier"
          test "$(docker exec app id -u)" = "1000"
          docker logs app | tail -n 5
      - name: Push
        run: docker push ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
